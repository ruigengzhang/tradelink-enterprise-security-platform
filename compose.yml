services:
  tradelink:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TRADELINK_DB: /app/instance/tradelink.sqlite3
    volumes:
      - tradelink-db:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
  detector:
    build: .
    command: ["python", "-m", "tradelink.worker", "--db", "/app/instance/tradelink.sqlite3", "--interval", "10"]
    environment:
      TRADELINK_DB: /app/instance/tradelink.sqlite3
    volumes:
      - tradelink-db:/app/instance
    read_only: true
    tmpfs:
      - /tmp
volumes:
  tradelink-db:
